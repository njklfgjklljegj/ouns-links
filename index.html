    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: var(--white);
      color: var(--black);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    }
    main {
      width: min(100%, 430px);
      text-align: center;
      animation: appear .65s ease both;
    }
    .avatar {
      width: 94px;
      height: 94px;
      margin: 0 auto 19px;
      border: 2px solid #111;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 850;
      letter-spacing: -2px;
      background: #fff;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 3rem);
      line-height: 1.2;
      font-weight: 850;
      letter-spacing: -.8px;
    }
    .english {
      margin: 5px 0 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: 2px;
    }
    .subtitle {
      margin: 14px 0 30px;
      color: #555;
      font-size: .98rem;
    }
    .links { display: grid; gap: 14px; }
    .link {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 16px;
      padding: 16px 20px;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .link:hover, .link:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 10px 22px rgba(0,0,0,.12);
      outline: none;
    }
    .link:active { transform: translateY(-1px) scale(.99); }
    .whatsapp { background: var(--whatsapp); color: #000; }
    .snapchat { background: var(--snapchat); color: #000; }
    .tiktok {
      background: #080808;
      color: #fff;
      border: 1px solid #bcbcbc;
    }
    .icon { width: 24px; height: 24px; flex: 0 0 24px; }
    footer {
      margin-top: 28px;
      color: #777;
      font-size: .82rem;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
