<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouns Links</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .profile-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .name-ar {
            font-size: 32px;
            font-weight: bold;
            margin: 5px 0;
        }

        .name-en {
            font-size: 20px;
            color: #555555;
            margin: 0;
            letter-spacing: 1px;
        }

        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* ألوان المنصات */
        .whatsapp {
            background-color: #25D366;
        }

        .snapchat {
            background-color: #FFFC00;
            color: #000000; /* السناب خطه أسود لأن خلفيته صفراء */
        }

        .tiktok {
            background-color: #000000;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1 class="name-ar">أُونس</h1>
        <h2 class="name-en">Ouns</h2>
    </div>

    <div class="links-container">
        <!-- رابط الواتساب -->
        <a href="https://wa.me" target="_blank" class="link-card whatsapp">
            WhatsApp
        </a>

        <!-- رابط السناب شات -->
        <a href="https://snapchat.com" target="_blank" class="link-card snapchat">
            Snapchat
        </a>

        <!-- رابط التيك توك -->
        <a href="https://tiktok.com" target="_blank" class="link-card tiktok">
            TikTok
        </a>
    </div>

</body>
</html>
